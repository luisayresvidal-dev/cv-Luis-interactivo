<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Ropa Interactiva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .favorito-resaltado { 
            border: 3px solid #000 !important; 
            background-color: #f1f1f1;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .card-img-top { height: 350px; object-fit: cover; }
        #mensaje-flotante {
            position: fixed; bottom: 30px; right: 30px; 
            z-index: 9999; display: none; padding: 15px 25px;
            border-radius: 5px; font-weight: bold; background: #333; color: #fff;
        }
    </style>
</head>
<body class="bg-light">

    <div id="mensaje-flotante"></div>

    <div id="carruselTienda" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://images.unsplash.com/photo-1441984904996-e0b6ba687e04?w=1200&h=400&fit=crop" class="d-block w-100" alt="Tienda 1">
            </div>
            <div class="carousel-item">
                <img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=1200&h=400&fit=crop" class="d-block w-100" alt="Tienda 2">
            </div>
            <div class="carousel-item">
                <img src="https://images.unsplash.com/photo-1470309864661-68328b2cd0a5?w=1200&h=400&fit=crop" class="d-block w-100" alt="Tienda 3">
            </div>
        </div>
    </div>

    <div class="container my-5">
        <h2 class="text-center mb-5 fw-bold text-uppercase">Catálogo de Moda</h2>
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card h-100 producto-card border-0 shadow-sm">
                    <img src="https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=500" class="card-img-top" alt="Chaqueta">
                    <div class="card-body text-center">
                        <h5 class="card-title">Chaqueta Urbana</h5>
                        <button class="btn btn-dark btn-favorito">Añadir a Favoritos</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="card h-100 producto-card border-0 shadow-sm">
                    <img src="https://images.unsplash.com/photo-1542272604-787c3835535d?w=500" class="card-img-top" alt="Jeans">
                    <div class="card-body text-center">
                        <h5 class="card-title">Jeans Classic</h5>
                        <button class="btn btn-dark btn-favorito">Añadir a Favoritos</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="card h-100 producto-card border-0 shadow-sm">
                    <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500" class="card-img-top" alt="Camiseta">
                    <div class="card-body text-center">
                        <h5 class="card-title">Camiseta Minimal</h5>
                        <button class="btn btn-dark btn-favorito">Añadir a Favoritos</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="card h-100 producto-card border-0 shadow-sm">
                    <img src="https://images.unsplash.com/photo-1515372039744-b8f02a3ae446?w=500" class="card-img-top" alt="Vestido">
                    <div class="card-body text-center">
                        <h5 class="card-title">Vestido Verano</h5>
                        <button class="btn btn-dark btn-favorito">Añadir a Favoritos</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="card h-100 producto-card border-0 shadow-sm">
                    <img src="https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=500" class="card-img-top" alt="Sudadera">
                    <div class="card-body text-center">
                        <h5 class="card-title">Sudadera Confort</h5>
                        <button class="btn btn-dark btn-favorito">Añadir a Favoritos</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="card h-100 producto-card border-0 shadow-sm">
                    <img src="https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=500" class="card-img-top" alt="Gorra">
                    <div class="card-body text-center">
                        <h5 class="card-title">Gorra Style</h5>
                        <button class="btn btn-dark btn-favorito">Añadir a Favoritos</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
